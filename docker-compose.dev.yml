services:
  app:
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    container_name: radar_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini
    command: sh /var/www/docker/php/entrypoint.dev.sh app
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp = @fsockopen(\"127.0.0.1\", 9000); if ($$fp) { fclose($$fp); exit(0); } exit(1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    container_name: radar_scheduler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
    command: sh /var/www/docker/php/entrypoint.dev.sh scheduler
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    image: mysql:8.0
    container_name: radar_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.dev.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma_laravel
    restart: "no"
    profiles:
      - tools
    depends_on:
      - db
    environment:
      - TZ=America/Sao_Paulo
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "8081:80"

  nginx:
    image: nginx:alpine
    container_name: radar_nginx
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
    deploy:
      resources:
        limits:
          memory: 64M

  node:
    image: node:20-alpine
    container_name: radar_node
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  dbdata:
  node_modules:
